name: Deploy Web

on:
  push:
    branches: [master, main]
    paths:
      - "src/renderer/**"
      - "vite.web.config.mts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_REPO: ${{ github.repository }}
      VITE_AUTHOR_URL: https://github.com/incoruptus
      VITE_PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      # Electron / Node 的完整测试在 Windows CI 跑；Pages 只跑渲染层单测，
      # 避免 Ubuntu 上的 Windows 路径用例把部署卡在测试步骤。
      - name: Renderer tests
        run: pnpm exec vitest run

      - name: Build web
        run: pnpm build:web

      # 产物自检：挂载点、相对路径、JS 产物齐全（防止发出一个白页）
      - name: Check release artifacts
        run: pnpm release:check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
