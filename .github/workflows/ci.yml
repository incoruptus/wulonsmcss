name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (renderer + Electron + parity + download contract)
        run: pnpm test

      - name: Tests (Rust agent)
        run: cargo test --manifest-path agent/Cargo.toml

      - name: Build desktop bundle
        run: pnpm build

      - name: Build web
        run: pnpm build:web

      - name: Release check (web)
        run: node scripts/check-release.cjs
